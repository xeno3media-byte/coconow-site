services:
  - type: web
    name: coconow-store
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: coconow-db
          property: connectionString
      - key: ADMIN_TOKEN
        generateValue: true
databases:
  - name: coconow-db
    databaseName: coconow
    user: coconow
    plan: free
