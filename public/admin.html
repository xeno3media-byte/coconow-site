<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>COCONOW — Manage store</title>
<style>
  :root { --cream: #F8F8F0; --brown: #463721; --yellow: #FDE89F; --ink: #241B0E; --muted: rgba(36,27,14,.65); --line: rgba(70,55,33,.25); }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--cream); color: var(--ink); }
  header { background: var(--brown); color: var(--cream); padding: 1rem 1.25rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: .5rem; }
  header h1 { font-size: 1.25rem; margin: 0; letter-spacing: .02em; }
  header a { color: var(--yellow); }
  main { max-width: 960px; margin: 0 auto; padding: 1.25rem; }
  section { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 1rem 1.25rem; margin-bottom: 1.25rem; }
  h2 { margin: 0 0 .75rem; font-size: 1.1rem; }
  label { display: block; font-size: .85rem; font-weight: 600; margin: .6rem 0 .25rem; }
  input[type="text"], input[type="password"], input[type="number"], textarea { width: 100%; padding: .6rem .7rem; border: 1px solid var(--line); border-radius: 8px; font: inherit; background: var(--cream); }
  input[type="checkbox"] { width: 1.1rem; height: 1.1rem; }
  button { background: var(--brown); color: var(--cream); border: 0; border-radius: 999px; padding: .6rem 1.2rem; font: inherit; font-weight: 700; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  button.ghost { background: transparent; color: var(--brown); border: 1px solid var(--brown); }
  .row { display: flex; gap: .75rem; align-items: end; flex-wrap: wrap; }
  .row > div { flex: 1 1 140px; }
  .msg { margin: .75rem 0 0; color: #8a2f2f; font-weight: 600; }
  .msg.ok { color: #2f6b3a; }
  .order { border: 1px solid var(--line); border-radius: 10px; padding: .9rem 1rem; margin-bottom: .8rem; background: var(--cream); }
  .order .top { display: flex; justify-content: space-between; gap: .5rem; flex-wrap: wrap; font-weight: 700; }
  .order .meta { color: var(--muted); font-size: .9rem; margin: .4rem 0; white-space: pre-line; }
  .order table { width: 100%; border-collapse: collapse; font-size: .92rem; }
  .order td, .order th { padding: .25rem 0; text-align: left; border-bottom: 1px solid var(--line); }
  .order td:last-child, .order th:last-child { text-align: right; }
  .order .totals { text-align: right; font-size: .95rem; margin-top: .4rem; }
  .prod { display: flex; gap: .75rem; align-items: end; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding: .6rem 0; }
  .prod .nm { flex: 2 1 160px; font-weight: 700; }
  .prod .fld { flex: 1 1 110px; }
  .muted { color: var(--muted); font-size: .9rem; }
  .hidden { display: none; }
</style>
</head>
<body>
<header>
  <h1>COCONOW — Manage store</h1>
  <a href="/">Back to the store</a>
</header>
<main>
  <section id="auth-box">
    <h2>Owner sign-in</h2>
    <p class="muted">Enter the admin token (the ADMIN_TOKEN set on the server). It is kept in this browser tab only.</p>
    <div class="row">
      <div><label for="token">Admin token</label><input type="password" id="token" autocomplete="off" placeholder="ADMIN_TOKEN" /></div>
      <div style="flex:0 0 auto"><button id="unlock-btn" type="button">Unlock</button></div>
    </div>
    <p class="msg" id="auth-msg"></p>
  </section>

  <div id="admin-body" class="hidden">
    <section>
      <h2>Orders <span class="muted" id="order-count"></span></h2>
      <div class="row">
        <div style="flex:0 0 auto"><button id="refresh-orders" type="button">Refresh orders</button></div>
      </div>
      <p class="msg" id="orders-msg"></p>
      <div id="orders"></div>
    </section>

    <section>
      <h2>Products</h2>
      <p class="muted">Price changes apply to the storefront straight away (the store loads its prices from the server).</p>
      <p class="msg" id="products-msg"></p>
      <div id="products"></div>
    </section>

    <section>
      <h2>Delivery &amp; payment</h2>
      <div class="row">
        <div><label for="set-dhaka">Delivery inside Dhaka (৳)</label><input type="number" id="set-dhaka" min="0" step="1" /></div>
        <div><label for="set-nationwide">Delivery nationwide (৳)</label><input type="number" id="set-nationwide" min="0" step="1" /></div>
        <div style="flex:0 0 auto"><label><input type="checkbox" id="set-cod" /> Cash on Delivery on</label></div>
        <div style="flex:0 0 auto"><button id="save-settings" type="button">Save settings</button></div>
      </div>
      <p class="msg" id="settings-msg"></p>
    </section>
  </div>
</main>
<script>
(function () {
  var token = sessionStorage.getItem("coconow_admin_token") || "";
  var tokenInput = document.getElementById("token");
  var authMsg = document.getElementById("auth-msg");
  var adminBody = document.getElementById("admin-body");
  var ordersBox = document.getElementById("orders");
  var productsBox = document.getElementById("products");
  var ordersMsg = document.getElementById("orders-msg");
  var productsMsg = document.getElementById("products-msg");
  var settingsMsg = document.getElementById("settings-msg");
  var orderCount = document.getElementById("order-count");

  function fmt(n) { return "৳" + Number(n).toLocaleString("en-US"); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function show(el, text, ok) { el.textContent = text || ""; el.className = "msg" + (ok ? " ok" : ""); }
  function api(path, opts) {
    opts = opts || {};
    opts.headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {}, { "Authorization": "Bearer " + token });
    return fetch(path, opts).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (data) {
        if (!r.ok) throw new Error((data && data.error) || ("Request failed (" + r.status + ")"));
        return data;
      });
    });
  }

  function renderOrders(data) {
    var list = data.orders || [];
    orderCount.textContent = list.length ? "(" + list.length + ")" : "";
    if (!list.length) { ordersBox.innerHTML = "<p class=\"muted\">No orders yet.</p>"; return; }
    ordersBox.innerHTML = list.map(function (o) {
      var items = (o.items || []).map(function (it) {
        return "<tr><td>" + esc(it.productName) + " × " + it.qty + "</td><td>" + fmt(it.unitPrice * it.qty) + "</td></tr>";
      }).join("");
      var date = o.createdAt ? new Date(o.createdAt).toLocaleString("en-GB") : "";
      return "<div class=\"order\">" +
        "<div class=\"top\"><span>" + esc(o.orderNumber) + "</span><span>" + esc(o.status) + "</span></div>" +
        "<div class=\"meta\">" + esc(date) + "\n" + esc(o.customerName) + " · " + esc(o.phone) + "\n" + esc(o.address) + ", " + esc(o.district) + " · " + (o.deliveryArea === "dhaka" ? "Inside Dhaka" : "Nationwide") + "\n" + (o.instructions ? "Note: " + esc(o.instructions) : "") + "</div>" +
        "<table><thead><tr><th>Item</th><th>Amount</th></tr></thead><tbody>" + items + "</tbody></table>" +
        "<div class=\"totals\">Subtotal " + fmt(o.subtotal) + " · Delivery " + fmt(o.deliveryFee) + " · <strong>Total " + fmt(o.total) + "</strong> (" + esc(o.paymentMethod) + ")</div>" +
        "</div>";
    }).join("");
  }

  function renderProducts(data) {
    var list = data.products || [];
    productsBox.innerHTML = list.map(function (p) {
      return "<div class=\"prod\" data-id=\"" + p.id + "\">" +
        "<div class=\"nm\">" + esc(p.name) + "<div class=\"muted\">" + esc(p.tagline) + " · " + esc(p.unit) + "</div></div>" +
        "<div class=\"fld\"><label>Price (৳)</label><input type=\"number\" class=\"p-price\" min=\"0\" step=\"1\" value=\"" + p.priceBdt + "\" /></div>" +
        "<div class=\"fld\"><label><input type=\"checkbox\" class=\"p-avail\"" + (p.available ? " checked" : "") + " /> Available</label></div>" +
        "<div><button type=\"button\" class=\"p-save\">Save</button></div>" +
        "</div>";
    }).join("");
    productsBox.querySelectorAll(".prod").forEach(function (row) {
      row.querySelector(".p-save").addEventListener("click", function () {
        var id = row.getAttribute("data-id");
        var price = Number(row.querySelector(".p-price").value);
        var avail = row.querySelector(".p-avail").checked;
        show(productsMsg, "Saving…");
        api("/api/admin/products/" + id, { method: "PUT", body: JSON.stringify({ priceBdt: price, available: avail }) })
          .then(function () { show(productsMsg, "Saved.", true); })
          .catch(function (e) { show(productsMsg, e.message); });
      });
    });
  }

  function renderSettings(data) {
    var s = data.settings || {};
    document.getElementById("set-dhaka").value = s.deliveryDhaka;
    document.getElementById("set-nationwide").value = s.deliveryNationwide;
    document.getElementById("set-cod").checked = !!s.codEnabled;
  }

  function loadAll() {
    show(ordersMsg, "Loading…");
    api("/api/admin/orders").then(function (data) { renderOrders(data); show(ordersMsg, ""); })
      .catch(function (e) { show(ordersMsg, e.message); });
    api("/api/products").then(function (data) { renderProducts(data); renderSettings(data); })
      .catch(function (e) { show(productsMsg, e.message); });
  }

  function unlock() {
    token = tokenInput.value.trim();
    if (!token) { show(authMsg, "Enter the admin token first."); return; }
    sessionStorage.setItem("coconow_admin_token", token);
    show(authMsg, "Checking…");
    api("/api/admin/orders").then(function (data) {
      show(authMsg, "Unlocked.", true);
      adminBody.classList.remove("hidden");
      renderOrders(data);
      show(ordersMsg, "");
      return api("/api/products");
    }).then(function (data) { renderProducts(data); renderSettings(data); })
    .catch(function (e) {
      show(authMsg, e.message);
      adminBody.classList.add("hidden");
    });
  }

  document.getElementById("unlock-btn").addEventListener("click", unlock);
  tokenInput.addEventListener("keydown", function (e) { if (e.key === "Enter") unlock(); });
  document.getElementById("refresh-orders").addEventListener("click", loadAll);
  document.getElementById("save-settings").addEventListener("click", function () {
    var dhaka = Number(document.getElementById("set-dhaka").value);
    var nationwide = Number(document.getElementById("set-nationwide").value);
    var cod = document.getElementById("set-cod").checked;
    show(settingsMsg, "Saving…");
    api("/api/admin/settings", { method: "PUT", body: JSON.stringify({ deliveryDhaka: dhaka, deliveryNationwide: nationwide, codEnabled: cod }) })
      .then(function () { show(settingsMsg, "Settings saved.", true); })
      .catch(function (e) { show(settingsMsg, e.message); });
  });

  if (token) { tokenInput.value = token; unlock(); }
})();
</script>
</body>
</html>
